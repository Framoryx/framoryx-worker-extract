name: CI do worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  workflow-validation:
    name: Validação do workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Instalar validador do workflow
        run: bash scripts/ci/install-tool.sh actionlint
      - name: Validar sintaxe e expressões do workflow
        run: actionlint
      - name: Validar sintaxe dos scripts de CI
        run: bash -n scripts/ci/check-coverage.sh scripts/ci/install-tool.sh
      - name: Validar sintaxe dos scripts de containers
        run: python3 -m py_compile scripts/ci/check-go-report.py scripts/ci/check-compose.py

  gate-tests:
    name: Verificação dos gates de CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Testar evidência de scan, rejeição OTLP e limpeza
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ci -p '*_test.py'

  formatting:
    name: Formatação Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar Go do projeto
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Conferir formatação sem modificar arquivos
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -l > "$RUNNER_TEMP/unformatted.txt"
          if [[ -s "$RUNNER_TEMP/unformatted.txt" ]]; then
            printf 'Arquivos Go precisam de formatação:\n' >&2
            cat "$RUNNER_TEMP/unformatted.txt"
            exit 1
          fi

  static-analysis:
    name: Análise estática Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar Go do projeto
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verificar código com go vet
        run: go vet ./...

  tests:
    name: Testes e concorrência
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar Go do projeto
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Executar testes e gerar cobertura dos pacotes internos
        run: go test -count=1 -race -shuffle=on -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Preservar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relatorio-cobertura
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Cobertura mínima de 80%
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recuperar relatório produzido pelos testes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: relatorio-cobertura
      - name: Bloquear cobertura ausente, inválida ou inferior a 80%
        run: bash scripts/ci/check-coverage.sh coverage.out

  build:
    name: Compilação do worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar Go do projeto
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compilar executável
        run: go build -trimpath -o dist/framoryx-worker-extract ./cmd
      - name: Preservar executável
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binario-worker
          path: dist/framoryx-worker-extract
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Segredos no histórico Git
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks
        run: bash scripts/ci/install-tool.sh gitleaks
      - name: Bloquear segredos no histórico completo
        run: |
          mkdir -p reports
          gitleaks git --log-opts=--all --redact=100 --no-banner --report-format=json --report-path=reports/gitleaks.json .
      - name: Preservar relatório com segredos ocultos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitleaks-historico
          path: reports/gitleaks.json
          if-no-files-found: error
          retention-days: 7

  dependencies:
    name: Vulnerabilidades das dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Instalar Trivy
        run: bash scripts/ci/install-tool.sh trivy
      - name: Bloquear vulnerabilidades HIGH e CRITICAL
        run: |
          mkdir -p reports
          trivy fs --no-progress --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-dependencies.json .
      - name: Preservar relatório de dependências
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-dependencias
          path: reports/trivy-dependencies.json
          if-no-files-found: error
          retention-days: 7

  executable-security:
    name: Vulnerabilidades do executável
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recuperar executável compilado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binario-worker
          path: dist
      - name: Instalar Trivy
        run: bash scripts/ci/install-tool.sh trivy
      - name: Bloquear vulnerabilidades do binário e da biblioteca padrão
        run: |
          mkdir -p reports
          test -s dist/framoryx-worker-extract
          chmod u+x dist/framoryx-worker-extract
          trivy rootfs --no-progress --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-executable.json dist
          python3 scripts/ci/check-go-report.py reports/trivy-executable.json
      - name: Preservar relatório do executável
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-executavel
          path: reports/trivy-executable.json
          if-no-files-found: error
          retention-days: 7

  infrastructure:
    name: Configuração de infraestrutura
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Instalar Trivy
        run: bash scripts/ci/install-tool.sh trivy
      - name: Verificar configurações aplicáveis
        run: |
          mkdir -p reports
          docker compose config --quiet
          trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-config.json .
      - name: Preservar relatório de configuração
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-configuracao
          path: reports/trivy-config.json
          if-no-files-found: error
          retention-days: 7

  image-build:
    name: Build da imagem Linux/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar builder isolado
        run: |
          docker buildx create --name worker-ci --driver docker-container \
            --driver-opt image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c --use
          docker buildx inspect --bootstrap
      - name: Construir imagem e exportar arquivo Docker
        run: |
          docker buildx build --platform "linux/$TARGET_ARCH" \
            --tag framoryx-worker-extract:local --output type=docker,dest=image.tar .
      - name: Conferir plataforma e filesystem da imagem exportada
        run: |
          test -s image.tar
          docker load --input image.tar
          docker image inspect --format '{{json .}}' framoryx-worker-extract:local > image-inspect.json
          python3 - <<'PY'
          import json
          import os
          import sys

          with open("image-inspect.json", encoding="utf-8") as report:
              image = json.load(report)
          expected_architecture = os.environ["TARGET_ARCH"]
          filesystem = image.get("RootFS", {})
          valid = image.get("Os") == "linux" and image.get("Architecture") == expected_architecture
          valid = valid and filesystem.get("Type") == "layers" and bool(filesystem.get("Layers"))
          if not valid:
              print("A plataforma ou o filesystem da imagem exportada não corresponde ao esperado.", file=sys.stderr)
              sys.exit(1)
          print("Imagem Linux/" + expected_architecture + " reconhecida com filesystem não vazio.")
          PY
          sha256sum image.tar > image.tar.sha256
      - name: Preservar imagem exata e checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imagem-worker-${{ matrix.arch }}
          path: |
            image.tar
            image.tar.sha256
            image-inspect.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remover builder isolado
        if: always()
        run: |
          if docker buildx inspect worker-ci > /dev/null 2>&1; then
            docker buildx rm worker-ci
          fi

  image-security:
    name: Vulnerabilidades da imagem Linux/${{ matrix.arch }}
    needs: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recuperar imagem exata da plataforma
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: imagem-worker-${{ matrix.arch }}
      - name: Validar integridade do arquivo da imagem
        run: sha256sum --check --strict image.tar.sha256
      - name: Instalar Trivy
        run: bash scripts/ci/install-tool.sh trivy
      - name: Bloquear vulnerabilidades da imagem e comprovar análise Go
        run: |
          mkdir -p reports
          trivy image --input image.tar --platform "linux/$TARGET_ARCH" --no-progress \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output "reports/trivy-image-$TARGET_ARCH.json"
          python3 scripts/ci/check-go-report.py "reports/trivy-image-$TARGET_ARCH.json"
      - name: Preservar relatório da imagem
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-imagem-${{ matrix.arch }}
          path: reports/trivy-image-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  compose-integration:
    name: Integração real com Compose e Grafana
    needs: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recuperar imagem AMD64 construída
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: imagem-worker-amd64
      - name: Validar e carregar a imagem exata do teste
        run: |
          mkdir -p reports/compose
          sha256sum --check --strict image.tar.sha256 | tee reports/compose/ci-image-checksum.txt
          docker load --input image.tar | tee reports/compose/ci-image-load.log
          docker image inspect --format '{{json .}}' framoryx-worker-extract:local > reports/compose/ci-image-inspect.json
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' framoryx-worker-extract:local)" = linux/amd64
      - name: Verificar startup, OTLP, persistência e SIGTERM sem rebuild
        run: python3 scripts/ci/check-compose.py --no-build --report-dir reports/compose
      - name: Preservar evidências do ambiente Compose
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integracao-compose
          path: reports/compose
          if-no-files-found: error
          retention-days: 7

  required-checks:
    name: Verificações internas obrigatórias
    if: always()
    needs:
      - workflow-validation
      - gate-tests
      - formatting
      - static-analysis
      - tests
      - coverage
      - build
      - secrets
      - dependencies
      - executable-security
      - infrastructure
      - image-build
      - image-security
      - compose-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir sucesso de todas as verificações internas
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          if not results:
              print("Resultados dos jobs obrigatórios ausentes.", file=sys.stderr)
              sys.exit(1)
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failures:
              print("Verificações internas não aprovadas:", failures, file=sys.stderr)
              sys.exit(1)
          print("Todas as verificações internas obrigatórias foram aprovadas.")
          PY
